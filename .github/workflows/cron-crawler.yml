name: Scheduled Crawler (4:30 PM UTC)

on:
  schedule:
    - cron: '30 16 * * *'  # 4:30 PM UTC daily
  workflow_dispatch:  # allow manual trigger from GitHub

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 2 hour timeout for crawl
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install
      
      - name: Run crawler for all portals
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          echo "Starting crawl at $(date)"
          python scripts/run_crawler_daemon.py
          echo "Crawl complete at $(date)"
      
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crawler-logs
          path: .crawler.log
          retention-days: 7
