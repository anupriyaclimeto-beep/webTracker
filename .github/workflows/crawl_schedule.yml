name: "Scheduled Crawl - EPR PLASTIC"

on:
  schedule:
    - cron: '20 6 * * *'   # 11:50 AM IST daily (UTC 06:20)
    - cron: '30 1 * * *'   # 7:00 AM IST daily  (UTC 01:30)
    - cron: '30 16 * * *'  # 10:00 PM IST daily (UTC 16:30)
  workflow_dispatch:
    inputs:
      portal:
        description: 'Portal to crawl'
        required: false
        default: 'EPR PLASTIC'

jobs:
  crawl:
    name: Run crawler for ${{ github.event.inputs.portal || 'EPR PLASTIC' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm-dev libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libglib2.0-0 libgtk-3-0 libx11-xcb1

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers and deps
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Create .env from secrets
        run: |
          cat > .env <<'ENV'
          SUPABASE_HOST=${{ secrets.SUPABASE_HOST }}
          SUPABASE_PORT=${{ secrets.SUPABASE_PORT }}
          SUPABASE_DB=${{ secrets.SUPABASE_DB }}
          SUPABASE_USER=${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD=${{ secrets.SUPABASE_PASSWORD }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LOGIN_USER=${{ secrets.LOGIN_USER }}
          LOGIN_PASS=${{ secrets.LOGIN_PASS }}
          CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
          ENV

      - name: Run crawler
        env:
          PYTHONPATH: ${{ github.workspace }}
          CI: "true"
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
          SUPABASE_DB: ${{ secrets.SUPABASE_DB }}
          SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LOGIN_USER: ${{ secrets.LOGIN_USER }}
          LOGIN_PASS: ${{ secrets.LOGIN_PASS }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          python crawler.py --once --portal "${{ github.event.inputs.portal || 'EPR PLASTIC' }}"

      - name: Upload artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-results-${{ github.run_number }}
          path: |
            crawler.log
            archive/
          retention-days: 7

      - name: Write job summary
        if: always()
        run: |
          echo "Portal: ${{ github.event.inputs.portal || 'EPR PLASTIC' }}" >> $GITHUB_STEP_SUMMARY
          echo "Run: ${{ github.run_number }} (commit: ${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then echo "Status: SUCCESS" >> $GITHUB_STEP_SUMMARY; else echo "Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY; fi

