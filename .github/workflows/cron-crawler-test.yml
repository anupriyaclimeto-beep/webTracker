name: Scheduled Crawler Test (5:00 PM UTC)

on:
  schedule:
    - cron: '30 11 * * *'  # 5:00 PM IST daily (11:30 AM UTC = 5:00 PM IST)
  workflow_dispatch:  # allow manual trigger from GitHub

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 2 hour timeout for crawl
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install
      
      - name: Run crawler for all portals (TEST RUN)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          echo "🧪 Starting TEST crawl at $(date) [5:00 PM IST]"
          python scripts/run_crawler_daemon.py
          echo "✅ TEST crawl complete at $(date)"
      
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: crawler-test-logs
          path: .crawler.log
          retention-days: 7
