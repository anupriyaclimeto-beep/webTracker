name: Scheduled Crawler (5:30 PM IST)

on:
  schedule:
    - cron: '0 12 * * *'  # 5:30 PM IST daily (12:00 PM UTC = 5:30 PM IST)
  workflow_dispatch:  # allow manual trigger from GitHub

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 2 hour timeout for crawl
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install
      
      - name: Run crawler for all portals
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          echo "🚀 Starting crawl at $(date) [5:30 PM IST]"
          python scripts/run_crawler_daemon.py 2>&1 | tee crawler.log
          echo "✅ Crawl complete at $(date)"
      
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crawler-logs-530pm
          path: crawler.log
          retention-days: 7
