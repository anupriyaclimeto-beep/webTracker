[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webtracker"
version = "1.0.0"
description = "Portal change monitoring and crawler system with Flask backend and Streamlit frontend"
authors = [
    {name = "WebTracker Team"},
]
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.1.3",
    "flask-cors>=4.0.0",
    "python-dotenv>=1.2.2",
    "psycopg2-binary>=2.9.12",
    "streamlit>=1.57.0",
    "playwright>=1.60.0",
    "beautifulsoup4>=4.14.3",
    "pillow>=12.2.0",
    "deepdiff>=9.1.0",
    "requests>=2.34.2",
    "pytz>=2024.1",
    "apscheduler>=3.10.0",
]

[project.urls]
Homepage = "https://github.com/anupriyaclimeto-beep/webTracker"
Repository = "https://github.com/anupriyaclimeto-beep/webTracker.git"

[tool.vercel]
entrypoint = "api:app"
